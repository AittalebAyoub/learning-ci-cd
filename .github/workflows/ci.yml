name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install pytest flake8 black

      - name: Lancer le linting
        run: flake8 calculator.py test_calculator.py

      - name: Vérifier le formatting
        run: black --check --diff calculator.py test_calculator.py

      - name: Lancer les tests
        run: pytest